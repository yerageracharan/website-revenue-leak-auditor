<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Illustrative terminal run</title><desc id="desc">An illustrative command-line example using the actual revenue-auditor options.</desc>
<rect width="1200" height="500" rx="22" fill="#f4f1f7"/>
<rect x="20" y="20" width="1160" height="460" rx="18" fill="#111018" stroke="#7d45c8" stroke-width="5"/>
<path d="M20 38Q20 20 38 20H1162Q1180 20 1180 38V78H20Z" fill="#25212e"/>
<circle cx="53" cy="50" r="9" fill="#ff6b70"/><circle cx="83" cy="50" r="9" fill="#f5c45d"/><circle cx="113" cy="50" r="9" fill="#62c88b"/>
<text x="600" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#e6dff1">PowerShell / terminal — illustrative session</text>
<text x="58" y="126" font-family="Consolas,monospace" font-size="24" fill="#be91ff">$ git clone https://github.com/yerageracharan/website-revenue-leak-auditor.git</text>
<text x="58" y="164" font-family="Consolas,monospace" font-size="24" fill="#e8e2ef">$ cd website-revenue-leak-auditor</text>
<text x="58" y="202" font-family="Consolas,monospace" font-size="24" fill="#e8e2ef">$ python -m pip install -e ".[dev]"</text>
<rect x="48" y="231" width="1104" height="3" fill="#4e405e"/>
<text x="58" y="280" font-family="Consolas,monospace" font-size="24" fill="#be91ff">$ revenue-auditor https://example.test </text>
<text x="88" y="319" font-family="Consolas,monospace" font-size="24" fill="#e8e2ef">  --output reports/audit.md --json reports/audit.json </text>
<text x="88" y="358" font-family="Consolas,monospace" font-size="24" fill="#e8e2ef">  --html reports/audit.html</text>
<rect x="58" y="382" width="1035" height="1.5" fill="#554568"/>
<text x="58" y="420" font-family="Consolas,monospace" font-size="21" fill="#6dd49b">Done: page(s) inspected; finding(s) reported. See output files.</text>
<text x="58" y="454" font-family="Arial,sans-serif" font-size="16" fill="#b9adca">Illustrative command sequence only • example.test is reserved for documentation • no live audit is implied.</text>
</svg>