<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Website Revenue Leak Auditor quick-start commands</title>
<desc id="desc">Accurate setup steps for cloning the repository, creating a virtual environment, installing the project, and running the revenue-auditor command.</desc>
<defs>
 <linearGradient id="head" x2="1" y2="1"><stop stop-color="#8d51df"/><stop offset="1" stop-color="#4b2388"/></linearGradient>
 <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#b793e8" opacity=".3"/></pattern>
</defs>
<rect width="1200" height="620" rx="22" fill="#f7f5f1"/>
<rect x="18" y="18" width="1164" height="584" rx="18" fill="#fff" stroke="#21172c" stroke-width="3"/>
<path d="M18 37Q18 18 37 18H1163Q1182 18 1182 37V92H18Z" fill="#19141f"/>
<circle cx="55" cy="55" r="9" fill="#ff7277"/><circle cx="85" cy="55" r="9" fill="#f2c45c"/><circle cx="115" cy="55" r="9" fill="#68c88e"/>
<text x="600" y="63" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">YOUR FIRST AUDIT · QUICK START</text>
<rect x="44" y="117" width="1112" height="68" rx="12" fill="#f0e8fb"/>
<text x="70" y="145" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#6e38b5" letter-spacing="2">BEFORE YOU BEGIN</text>
<text x="70" y="169" font-family="Arial,sans-serif" font-size="18" fill="#29212f">Python 3.10+ · Git · permission to inspect the website</text>
<g font-family="Arial,sans-serif">
 <rect x="44" y="210" width="538" height="150" rx="14" fill="#fff" stroke="#d9cce9" stroke-width="2"/>
 <circle cx="78" cy="245" r="20" fill="url(#head)"/><text x="78" y="252" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">1</text>
 <text x="112" y="251" font-size="22" font-weight="800" fill="#19141f">Clone the repository</text>
 <rect x="66" y="272" width="494" height="68" rx="9" fill="#19141f"/>
 <text x="84" y="301" font-family="Consolas,monospace" font-size="16" fill="#cba9ff">git clone https://github.com/</text>
 <text x="84" y="324" font-family="Consolas,monospace" font-size="16" fill="#fff">yerageracharan/website-revenue-leak-auditor.git</text>

 <rect x="618" y="210" width="538" height="150" rx="14" fill="#fff" stroke="#d9cce9" stroke-width="2"/>
 <circle cx="652" cy="245" r="20" fill="url(#head)"/><text x="652" y="252" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">2</text>
 <text x="686" y="251" font-size="22" font-weight="800" fill="#19141f">Create a virtual environment</text>
 <rect x="640" y="272" width="494" height="68" rx="9" fill="#19141f"/>
 <text x="658" y="300" font-family="Consolas,monospace" font-size="16" fill="#cba9ff">python -m venv .venv</text>
 <text x="658" y="324" font-family="Consolas,monospace" font-size="15" fill="#fff">Activate it for your shell before installing.</text>

 <rect x="44" y="384" width="538" height="150" rx="14" fill="#fff" stroke="#d9cce9" stroke-width="2"/>
 <circle cx="78" cy="419" r="20" fill="url(#head)"/><text x="78" y="426" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">3</text>
 <text x="112" y="425" font-size="22" font-weight="800" fill="#19141f">Install the project</text>
 <rect x="66" y="446" width="494" height="68" rx="9" fill="#19141f"/>
 <text x="84" y="475" font-family="Consolas,monospace" font-size="16" fill="#cba9ff">python -m pip install --upgrade pip</text>
 <text x="84" y="499" font-family="Consolas,monospace" font-size="16" fill="#fff">python -m pip install -e ".[dev]"</text>

 <rect x="618" y="384" width="538" height="150" rx="14" fill="#fff" stroke="#d9cce9" stroke-width="2"/>
 <circle cx="652" cy="419" r="20" fill="url(#head)"/><text x="652" y="426" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">4</text>
 <text x="686" y="425" font-size="22" font-weight="800" fill="#19141f">Run the auditor</text>
 <rect x="640" y="446" width="494" height="68" rx="9" fill="#19141f"/>
 <text x="658" y="475" font-family="Consolas,monospace" font-size="16" fill="#cba9ff">revenue-auditor https://your-domain.com</text>
 <text x="658" y="499" font-family="Consolas,monospace" font-size="14" fill="#fff">--output reports/audit.md --html reports/audit.html</text>
</g>
<rect x="44" y="552" width="1112" height="30" rx="8" fill="#19141f"/>
<text x="600" y="573" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#fff">Replace the sample URL with a site you own or are authorised to assess. Add --json reports/audit.json for structured output.</text>
</svg>