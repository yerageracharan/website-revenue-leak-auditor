<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Illustrative audit report preview</title><desc id="desc">A sample of the self-contained HTML report generated by the CLI, with synthetic example.test findings and no fabricated performance score.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#faf8f4"/><stop offset="1" stop-color="#efeaf6"/></linearGradient></defs>
<rect width="1200" height="620" rx="24" fill="url(#bg)"/>
<rect x="22" y="20" width="1156" height="580" rx="18" fill="#fff" stroke="#1b1720" stroke-width="3"/>
<rect x="22" y="20" width="1156" height="60" rx="18" fill="#19141f"/><path d="M22 59H1178V80H22Z" fill="#19141f"/>
<circle cx="52" cy="50" r="8" fill="#ff7075"/><circle cx="78" cy="50" r="8" fill="#f7c15f"/><circle cx="104" cy="50" r="8" fill="#62c88b"/>
<text x="140" y="58" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Website Revenue Leak Auditor / HTML report</text>
<text x="58" y="125" font-family="Arial Black,Arial,sans-serif" font-size="34" font-weight="900" fill="#17131d">Website audit report</text>
<text x="59" y="158" font-family="Consolas,monospace" font-size="18" fill="#766d80">https://example.test</text>
<rect x="58" y="186" width="1080" height="92" rx="14" fill="#f6f3f9" stroke="#e0d8eb"/>
<g font-family="Arial,sans-serif"><text x="85" y="220" font-size="14" fill="#756d7f">HIGH PRIORITY</text><text x="85" y="257" font-size="35" font-weight="900" fill="#a33d42">1</text><text x="430" y="220" font-size="14" fill="#756d7f">MEDIUM PRIORITY</text><text x="430" y="257" font-size="35" font-weight="900" fill="#94601c">2</text><text x="790" y="220" font-size="14" fill="#756d7f">LOW PRIORITY</text><text x="790" y="257" font-size="35" font-weight="900" fill="#26694d">1</text></g>
<rect x="58" y="304" width="1080" height="112" rx="14" fill="#fff" stroke="#e1dce5"/>
<rect x="78" y="324" width="8" height="72" rx="4" fill="#a33d42"/>
<rect x="105" y="324" width="140" height="26" rx="13" fill="#fce8e8"/><text x="175" y="342" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#a33d42">HIGH IMPACT</text>
<text x="270" y="345" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17131d">A crawled page returned HTTP 404</text>
<text x="105" y="376" font-family="Arial,sans-serif" font-size="16" fill="#625a69">Evidence: the inspected URL returned status 404 at audit time.</text>
<text x="105" y="399" font-family="Arial,sans-serif" font-size="16" fill="#625a69">Fix: restore the page or update the internal link; re-request the exact URL to verify.</text>
<rect x="58" y="438" width="1080" height="112" rx="14" fill="#fff" stroke="#e1dce5"/>
<rect x="78" y="458" width="8" height="72" rx="4" fill="#98621a"/>
<rect x="105" y="458" width="160" height="26" rx="13" fill="#fff1d7"/><text x="185" y="476" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#98621a">MEDIUM IMPACT</text>
<text x="285" y="479" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17131d">Viewport configuration is missing</text>
<text x="105" y="510" font-family="Arial,sans-serif" font-size="16" fill="#625a69">Evidence: no meta name="viewport" tag was found in inspected HTML.</text>
<text x="105" y="533" font-family="Arial,sans-serif" font-size="16" fill="#625a69">Fix: add a responsive viewport declaration and manually verify on mobile widths.</text>
<text x="60" y="579" font-family="Arial,sans-serif" font-size="15" fill="#756d7f">SYNTHETIC PREVIEW • Illustrates report layout only; not a live domain scan or measured business result.</text>
</svg>